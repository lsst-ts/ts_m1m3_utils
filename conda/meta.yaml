{% set data = load_setup_py_data() %}

package:
  name: ts-m1m3-utils
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{PYTHON}} -m pip install --no-deps --ignore-installed .
  entry_points:
    - m1m3-aav = lsst.ts.m1m3.utils.acceleration_and_velocity:run
    - m1m3-do-bump-tests = lsst.ts.m1m3.utils.m1m3_do_bump_tests:run
    - m1m3-bump-tests-times = lsst.ts.m1m3.utils.m1m3_bump_tests_times:run
    - m1m3-fcu-stats = lsst.ts.m1m3.utils.fcu_stats:run

test:
  requires:
    - pytest
    - vcrpy
    - ts-conda-build =0.5
  source_files:
    - python
    - tests
  commands:
    - pytest

requirements:
  host:
    - python {{python}}
    - setuptools >={{setuptools}}
    - setuptools_scm ={{setuptools_scm}}
  run:
    - python {{python}}
    - astropy
    - numpy
    - pandas
    - PySide6
    - scipy
    - tqdm
    - ts-xml
    - lsst-efd-client
    - ts-salobj
