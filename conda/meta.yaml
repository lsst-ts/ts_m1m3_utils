{% set data = load_setup_py_data() %}

package:
  name: ts-m1m3-utils
  version: {{ data.get('version') }}

source:
  path: ../

build:
  noarch: python
  script: {{PYTHON}} -m pip install --no-deps --ignore-installed .
  string: "py{{ PY_VER | replace('.', '') }}{{ PKG_HASH }}_{{ PKG_BUILDNUM }}"

test:
  requires:
    - pytest
    - ts-conda-build =0.5
    - vcrpy
  source_files:
    - pyproject.toml
    - python
    - tests
  commands:
    - pytest

requirements:
  host:
    - pip
    - python {{python}}
    - setuptools >={{setuptools}}
    - setuptools_scm ={{setuptools_scm}}
  run:
    - astropy
    - python {{python}}
    - lsst-efd-client
    - numpy
    - pandas
    - scipy
    - ts-salobj
    - ts-xml
